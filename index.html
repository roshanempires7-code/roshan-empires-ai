<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roshan Empires AI - Live Web Render</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #fff; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #94a3b8; margin-bottom: 20px; }
        .input-box { display: flex; gap: 10px; margin-bottom: 20px; }
        textarea { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 15px; height: 60px; resize: none; }
        button { padding: 0 25px; background: #0284c7; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0369a1; }
        .preview-container { width: 100%; height: 75vh; background: #ffffff; border-radius: 8px; border: 2px solid #334155; overflow: hidden; margin-top: 10px; }
        iframe { width: 100%; height: 100%; border: none; }
        .status { margin-bottom: 8px; font-weight: bold; color: #38bdf8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Roshan Empires AI 🚀</h1>
        <p class="subtitle">Enter your prompt to render a live website preview instantly!</p>
        
        <div class="input-box">
            <textarea id="promptInput" placeholder="e.g. Build a modern website for NEXO Pet shop with Tailwind CSS"></textarea>
            <button onclick="generateWebsite()">Generate Website 🎨</button>
        </div>

        <div class="status" id="statusText">Live Preview Output:</div>
        
        <div class="preview-container">
            <iframe id="webPreview" srcdoc="<h2 style='font-family:sans-serif; text-align:center; margin-top:20%; color:#64748b;'>Enter a prompt above and click Generate to view your live website here!</h2>"></iframe>
        </div>
    </div>

    <script>
        const BACKEND_URL = "/run";

        async function generateWebsite() {
            const prompt = document.getElementById('promptInput').value;
            const previewFrame = document.getElementById('webPreview');
            const statusText = document.getElementById('statusText');

            if (!prompt) {
                alert("Please enter a task!");
                return;
            }

            statusText.innerText = "Generating Website... Please wait ⏳";
            previewFrame.srcdoc = "<h2 style='font-family:sans-serif; text-align:center; margin-top:20%; color:#0284c7;'>Building your website with AI... 🚀</h2>";

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await response.json();
                
                if (data.result) {
                    statusText.innerText = "Live Website Rendered Successfully! ✅";
                    previewFrame.srcdoc = data.result;
                } else {
                    statusText.innerText = "Error generating website.";
                }
            } catch (err) {
                statusText.innerText = "Connection Error!";
                console.error(err);
            }
        }
    </script>
</body>
</html>
