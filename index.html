<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roshan Empires - AI Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 600px;
            border: 1px solid #334155;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #38bdf8;
            font-size: 28px;
        }

        p.subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #38bdf8;
        }

        button {
            padding: 12px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0369a1;
        }

        .result-box {
            margin-top: 20px;
            padding: 16px;
            background-color: #0f172a;
            border-radius: 8px;
            border-left: 4px solid #38bdf8;
            display: none;
        }

        .result-title {
            font-size: 14px;
            color: #38bdf8;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .result-content {
            font-size: 15px;
            white-space: pre-line;
            line-height: 1.5;
        }

        .loading {
            text-align: center;
            color: #38bdf8;
            display: none;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Roshan Empires AI</h1>
        <p class="subtitle">Enter your task below to process via Roshan AI Server</p>

        <div class="input-group">
            <textarea id="taskInput" placeholder="Write your task here (e.g. Write a 2-line poem about AI)..."></textarea>
            <button onclick="sendTask()">Submit Task 🚀</button>
        </div>

        <div id="loading" class="loading">Processing with AI Server...</div>

        <div id="resultBox" class="result-box">
            <div class="result-title">Response Output:</div>
            <div id="resultContent" class="result-content"></div>
        </div>
    </div>

    <script>
        async function sendTask() {
            const taskText = document.getElementById('taskInput').value;
            const resultBox = document.getElementById('resultBox');
            const resultContent = document.getElementById('resultContent');
            const loading = document.getElementById('loading');

            if (!taskText.trim()) {
                alert("Please enter a task first!");
                return;
            }

            loading.style.display = 'block';
            resultBox.style.display = 'none';

            try {
                const response = await fetch('http://127.0.0.1:8000/run', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ task: taskText })
                });

                const data = await response.json();
                loading.style.display = 'none';

                if (response.ok) {
                    resultContent.innerText = data.result;
                    resultBox.style.display = 'block';
                } else {
                    resultContent.innerText = "Error: " + JSON.stringify(data.detail);
                    resultBox.style.display = 'block';
                }
            } catch (error) {
                loading.style.display = 'none';
                alert("Cannot connect to server. Make sure Python uvicorn server is running!");
            }
        }
    </script>
</body>
</html>
